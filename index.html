<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Rehearsal Tracks</title>
  <meta name="description" content="Mix the track yourself — interactive stems, right in your browser." />
  <meta name="theme-color" content="#0a0e07" />
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <!-- PWA: installable app shell -->
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Rehearsal" />
  <!-- Before first paint: the cached project theme (see js/theme-boot.js). Classic + synchronous on purpose; needs no CSS. -->
  <script src="js/theme-boot.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&display=swap" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div id="nav-root"></div>

  <main class="landing" aria-live="polite">
    <header class="landing__header">
      <p class="player__eyebrow" id="eyebrow">Interactive Stem Player</p>
      <h1 class="landing__title" id="page-title">Rehearsal Tracks</h1>
      <p class="landing__sub" id="page-note" hidden></p>
    </header>

    <div id="song-list" class="song-list"></div>

    <section id="downloads" class="downloads" hidden></section>

    <p class="player__hint" id="credit" hidden></p>
  </main>

  <script type="module" src="js/landing.js"></script>
  <script type="module" src="js/sw-register.js"></script>
</body>
</html>
